version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: supersecret
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    ports:
      - "23001:23001"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: supersecret
      AUTH_JWT_SECRET: myjwtsecret
      AUTH_JWT_ALGORITHM: HS256
      AUTH_JWT_EXPIRE_MINUTES: 60
      AUTH_SMTP_HOST: smtp.mailtrap.io
      AUTH_SMTP_PORT: 2525
      AUTH_SMTP_USER: smtp_user
      AUTH_SMTP_PASSWORD: smtp_password
      AUTH_EMAIL_FROM: noreply@myapp.com
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:23001
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:23001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:23001/api
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5