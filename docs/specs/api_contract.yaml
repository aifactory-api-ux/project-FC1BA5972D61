# API_CONTRACT.md

## Endpoints

### POST /api/auth/register

| Attribute         | Value                        |
|-------------------|-----------------------------|
| Method            | POST                        |
| Path              | /api/auth/register          |
| Auth Required     | No                          |
| Request Body      | UserRegisterRequest         |
| Response Body     | UserRegisterResponse        |
| Status Codes      | 201, 400, 409               |

#### Request Body: UserRegisterRequest

| Field    | Type    | Required |
|----------|---------|----------|
| email    | string  | Yes      |
| password | string  | Yes      |

#### Response Body: UserRegisterResponse

| Field | Type   |
|-------|--------|
| id    | int    |
| email | string |

---

### POST /api/auth/login

| Attribute         | Value                        |
|-------------------|-----------------------------|
| Method            | POST                        |
| Path              | /api/auth/login             |
| Auth Required     | No                          |
| Request Body      | UserLoginRequest            |
| Response Body     | UserLoginResponse           |
| Status Codes      | 200, 401                    |

#### Request Body: UserLoginRequest

| Field    | Type    | Required |
|----------|---------|----------|
| email    | string  | Yes      |
| password | string  | Yes      |

#### Response Body: UserLoginResponse

| Field        | Type   |
|--------------|--------|
| access_token | string |
| token_type   | string ("bearer") |

---

