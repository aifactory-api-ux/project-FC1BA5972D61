### GET /api/auth/me

| Attribute         | Value                        |
|-------------------|-----------------------------|
| Method            | GET                         |
| Path              | /api/auth/me                |
| Auth Required     | Yes (Authorization header)  |
| Request Body      | None                        |
| Response Body     | UserProfile                 |
| Status Codes      | 200, 401                    |

#### Response Body: UserProfile

| Field | Type   |
|-------|--------|
| id    | int    |
| email | string |
